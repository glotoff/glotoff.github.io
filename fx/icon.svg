<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#172554" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect width="512" height="512" rx="116" fill="url(#bg)" />
  <rect x="14" y="14" width="484" height="484" rx="104" fill="none" stroke="url(#ring)" stroke-width="4" opacity="0.25" />

  <!-- Subtle Globe Grid -->
  <circle cx="256" cy="256" r="176" fill="#0f172a" fill-opacity="0.45" stroke="url(#ring)" stroke-width="10" opacity="0.35" />
  <ellipse cx="256" cy="256" rx="92" ry="176" fill="none" stroke="#38bdf8" stroke-width="5" opacity="0.18" />
  <line x1="80" y1="256" x2="432" y2="256" stroke="#38bdf8" stroke-width="5" opacity="0.18" />

  <!-- Top Exchange Arrow (Cyan) -->
  <path d="M132 192h228l-48-48" fill="none" stroke="url(#cyan)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Bottom Exchange Arrow (Gold) -->
  <path d="M380 320H152l48 48" fill="none" stroke="url(#gold)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Central Coin Emblem -->
  <circle cx="256" cy="256" r="68" fill="#0f172a" stroke="url(#ring)" stroke-width="10" />
  <text x="256" y="279" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="66" font-weight="900" letter-spacing="-2" fill="#f8fafc">FX</text>
</svg>
