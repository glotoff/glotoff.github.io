<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Simple offline-ready travel currency converter for up to 3 target currencies with persisted FX rates and history." />
  <title>Travel FX Converter</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="brand">
        <img src="./icon.svg" alt="" class="brand-icon" width="28" height="28" />
        <div>
          <h1 class="brand-title">Travel FX</h1>
          <p class="brand-subtitle" id="rate-status-text">Saved rates • Offline ready</p>
        </div>
      </div>
      <div class="header-actions">
        <button type="button" id="install-btn" class="btn-install hidden" aria-label="Install app on device">
          Install App
        </button>
      </div>
    </header>

    <main class="app-main">
      <!-- Source Currency Card (Travel Destination) -->
      <section class="card source-card" aria-labelledby="source-heading">
        <div class="card-header">
          <span id="source-heading" class="badge source-badge">Travel Country (Source)</span>
          <button type="button" id="clear-amounts-btn" class="btn-text" title="Clear current amounts">
            Clear amount
          </button>
        </div>

        <div class="converter-row">
          <div class="currency-select-wrapper">
            <select id="source-currency-select" class="currency-select" aria-label="Source currency"></select>
          </div>
          <div class="amount-input-wrapper">
            <input
              type="text"
              inputmode="decimal"
              id="source-amount-input"
              class="amount-input"
              placeholder="0"
              autocomplete="off"
              aria-label="Source currency amount"
            />
          </div>
        </div>
      </section>

      <!-- Target Currencies Section (Up to 3) -->
      <section class="targets-section" aria-labelledby="targets-heading">
        <div class="section-bar">
          <h2 id="targets-heading" class="section-title">Convert To / From</h2>
          <button type="button" id="fetch-rates-btn" class="btn-fetch">
            <svg class="icon-sync" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 2v6h-6"></path>
              <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
              <path d="M3 22v-6h6"></path>
              <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
            </svg>
            <span id="fetch-rates-label">Fetch Live Rates</span>
          </button>
        </div>

        <div id="targets-list" class="targets-list"></div>

        <button type="button" id="add-target-btn" class="btn-add-target">
          + Add Target Currency (up to 3)
        </button>
      </section>

      <!-- Conversion History Section -->
      <section class="history-section" aria-labelledby="history-heading">
        <div class="section-bar">
          <div>
            <h2 id="history-heading" class="section-title">Conversion History</h2>
            <p class="section-hint">Auto-saved after typing • Tap any row to reuse</p>
          </div>
          <button type="button" id="clear-history-btn" class="btn-text danger-text hidden">
            Clear All
          </button>
        </div>

        <div id="history-list" class="history-list"></div>
      </section>
    </main>
  </div>

  <script src="./app.js"></script>
</body>
</html>
