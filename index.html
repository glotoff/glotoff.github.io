<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>glotoff.github.io</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 60px 20px;
      text-align: center;
    }
    h1 {
      margin-bottom: 12px;
      font-size: 28px;
    }
    p {
      color: #94a3b8;
      margin-bottom: 36px;
    }
    .projects {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      max-width: 600px;
      margin: 0 auto;
    }
    .card {
      flex: 1 1 240px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 24px 20px;
      text-decoration: none;
      color: #38bdf8;
      font-weight: bold;
      font-size: 18px;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: #38bdf8;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    .desc {
      font-size: 13px;
      color: #94a3b8;
      font-weight: normal;
      margin-top: 8px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <h1>glotoff.github.io</h1>
  <p>Projects &amp; Interactive Applications</p>
  <div class="projects">
    <a href="khiva/" class="card">
      Historical Khiva Atlas
      <div class="desc">Interactive geotagged map of Itchan Kala with 770 photos &amp; POV videos</div>
    </a>
    <a href="fx/" class="card">
      FX
      <div class="desc">Currency &amp; FX tools</div>
    </a>
  </div>
</body>
</html>
